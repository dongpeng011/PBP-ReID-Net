name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install the remaining dependencies
        run: pip install -r requirements-ci.txt

      - name: Byte-compile every module
        run: |
          python -m compileall -q config datasets loss model processor solver tools utils
          python -m compileall -q train.py test.py

      - name: Unit tests
        run: python -m pytest tests -q

      - name: End-to-end smoke test (CPU)
        run: python tools/smoke_test.py

      - name: Check that the efficiency tools run
        run: |
          python tools/count_params_flops.py > /dev/null
          python tools/measure_speed.py --iterations 2 --warmup 1 --batch-size 2
